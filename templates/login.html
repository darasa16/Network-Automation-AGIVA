<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In &bull; PT Agiva Indonesia NOC</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">
    <!-- Custom CSS (Corporate Dark Theme matching Agiva) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=8.2">
</head>

<body class="login-body">
    <!-- Ambient Tech Glow Effects -->
    <div class="login-glow login-glow-1"></div>
    <div class="login-glow login-glow-2"></div>
    <div class="login-grid-pattern"></div>

    <main class="login-wrapper">
        <div class="login-card">
            <!-- Header Brand -->
            <div class="login-header">
                <div class="login-logo-container">
                    <img src="{{ url_for('static', filename='img/20260203-Agiva-Logo-Rect-1280px.png') }}"
                        alt="PT Agiva Indonesia Logo" class="login-logo" />
                </div>

                <h1 class="login-title">Control Center Access</h1>
                <p class="login-subtitle">
                    Otentikasi aman untuk pemantauan, otomatisasi telemetri, dan kontrol perangkat PT Agiva
                    Indonesia.
                </p>
            </div>

            <!-- Error Alert Banner -->
            {% if error %}
            <div class="login-alert login-alert-danger" role="alert">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <!-- Login Form -->
            <form action="{{ url_for('login', next=request.args.get('next')) }}" method="POST" class="login-form"
                autocomplete="on">
                <!-- Username Field -->
                <div class="form-group">
                    <label for="username" class="form-label">
                        <span>Username</span>
                    </label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        <input type="text" id="username" name="username" class="form-control"
                            placeholder="Masukkan username" required autofocus autocomplete="username" value="" />
                    </div>
                </div>

                <!-- Password Field -->
                <div class="form-group">
                    <label for="password" class="form-label">
                        <span>Password</span>
                    </label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <input type="password" id="password" name="password" class="form-control"
                            placeholder="Masukkan password" required autocomplete="current-password" />
                        <button type="button" class="btn-toggle-password" id="togglePasswordBtn"
                            title="Tampilkan / Sembunyikan Password" aria-label="Toggle password visibility">
                            <svg id="eyeIcon" viewBox="0 0 24 24" width="18" height="18" fill="none"
                                stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-login" id="submitBtn">
                    <span>Masuk ke Control Center</span>
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>
            </form>

            <!-- Card Footer -->
            <div class="login-footer">
                <div class="security-indicator">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                    </svg>
                    <span>Sesi Terenkripsi & Terotorisasi</span>
                </div>
                <div class="copyright">
                    &copy; 2026 PT Agiva Indonesia &bull; Network Monitoring Center
                </div>
            </div>
        </div>
    </main>

    <!-- Interactive Script -->
    <script>
        // Toggle Password Visibility
        const toggleBtn = document.getElementById('togglePasswordBtn');
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eyeIcon');

        if (toggleBtn && passwordInput && eyeIcon) {
            toggleBtn.addEventListener('click', () => {
                const isPassword = passwordInput.getAttribute('type') === 'password';
                passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
                if (isPassword) {
                    eyeIcon.innerHTML = `
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                        <line x1="1" y1="1" x2="23" y2="23"></line>
                    `;
                } else {
                    eyeIcon.innerHTML = `
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    `;
                }
            });
        }
    </script>
</body>

</html>
